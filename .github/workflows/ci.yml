name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

  ecs:
    name: ECS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run ECS
        run: ./vendor/bin/ecs check

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run unit tests
        run: ./vendor/bin/phpunit --testsuite Unit --testdox

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install and configure Mosquitto
        run: |
          sudo apt-get install -y mosquitto
          printf 'listener 1883\nallow_anonymous true\n' | sudo tee /etc/mosquitto/conf.d/test.conf
          sudo systemctl restart mosquitto

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run integration tests
        env:
          MQTT_HOST: localhost
          MQTT_PORT: 1883
        run: ./vendor/bin/phpunit --testsuite Integration --testdox
